# =============================================================================
#  Pacific Cold Storage — IT Asset Manager
#  Nginx server block (Ubuntu 22.04 + PHP-FPM 8.1+)
# -----------------------------------------------------------------------------
#  วิธีติดตั้ง:
#    1. cp config/nginx.conf  /etc/nginx/sites-available/it-asset-manager
#    2. ln -s /etc/nginx/sites-available/it-asset-manager  /etc/nginx/sites-enabled/
#    3. nginx -t  &&  systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name  it-assets.pacific-cs.local;

    # ชี้ไปที่ public/ เท่านั้น — กันคน access โดน config/ หรือ includes/ ตรงๆ
    root  /var/www/it-asset-manager/public;
    index index.php index.html;

    charset utf8;

    # -------------------------------------------------------------------------
    #  Upload limit — เผื่อ import CSV / แนบไฟล์ใบเสนอราคา
    #  ต้องปรับ php.ini คู่กัน: upload_max_filesize, post_max_size >= 64M
    # -------------------------------------------------------------------------
    client_max_body_size 64M;

    # -------------------------------------------------------------------------
    #  Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection         "1; mode=block" always;

    # -------------------------------------------------------------------------
    #  Logs
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/it-assets.access.log;
    error_log  /var/log/nginx/it-assets.error.log warn;

    # -------------------------------------------------------------------------
    #  Front controller — ส่ง path ที่ไม่ match ไฟล์จริงให้ index.php
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    #  PHP handler — ใช้ unix socket ของ PHP-FPM (เร็วกว่า TCP บนเครื่องเดียวกัน)
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # ปรับ version ให้ตรงกับเครื่อง
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # timeout เผื่อ query รายงานหนักๆ
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -------------------------------------------------------------------------
    #  ปฏิเสธ access ไฟล์ลับ / โฟลเดอร์ที่ไม่ควรเปิดสาธารณะ
    # -------------------------------------------------------------------------
    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }

    # ปิดไม่ให้ access config/ , includes/ , sql/ ผ่าน URL โดยตรง
    # (จริงๆ root อยู่ที่ public/ อยู่แล้ว แต่ใส่ซ้ำเป็นชั้นป้องกัน)
    location ~ ^/(config|includes|sql)/ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------------
    #  Static asset caching
    # -------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    #  Uploads directory — เสิร์ฟไฟล์ได้แต่ห้าม execute PHP
    # -------------------------------------------------------------------------
    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }
}
